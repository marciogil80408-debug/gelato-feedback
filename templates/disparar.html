<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disparador - Gelato da Fran</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: auto; background-color: #f9f9f9;}
        .box { background: white; border: 1px solid #ddd; padding: 20px; margin-bottom: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2, h3 { color: #333; margin-top: 0; }
        label { font-weight: bold; font-size: 14px; color: #555; }
        input, select, button { width: 100%; padding: 12px; margin-top: 8px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { background-color: #25D366; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #1DA851; }
        .btn-blue { background-color: #007bff; }
        .btn-blue:hover { background-color: #0056b3; }
        .link-painel { display: block; text-align: center; margin-top: 20px; color: #007bff; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <h2>📲 Disparador WhatsApp</h2>

    <!-- 1. DISPARAR PESQUISA -->
    <div class="box">
        <h3>1. Gerar Link de Pesquisa</h3>
        <label>Selecione um Cliente Cadastrado:</label>
        <select id="cliente_selecionado">
            <option value="">-- Escolha o cliente --</option>
            {% for c in clientes %}
                <option value="{{ c.nome }}" data-telefone="{{ c.telefone }}" data-rep="{{ c.representante }}">{{ c.nome }}</option>
            {% endfor %}
        </select>

        <label>WhatsApp do Cliente:</label>
        <input type="text" id="whatsapp_cliente" readonly style="background-color: #eee;">

        <label>Representante Responsável:</label>
        <input type="text" id="rep_cliente" readonly style="background-color: #eee;">

        <button onclick="disparar()">Abrir Conversa no WhatsApp 💬</button>
    </div>

    <!-- 2. CADASTRAR NOVO CLIENTE -->
    <div class="box">
        <h3>2. Cadastrar Novo Cliente</h3>
        <form action="/cadastrar_cliente" method="POST">
            <input type="text" name="nome" placeholder="Nome do Cliente / Comércio" required>
            <input type="text" name="telefone" placeholder="WhatsApp (apenas números, com DDD)" required>
            <select name="representante" required>
                <option value="">-- Atendido por qual representante? --</option>
                {% for r in representantes %}
                    <option value="{{ r.nome }}">{{ r.nome }}</option>
                {% endfor %}
            </select>
            <button type="submit" class="btn-blue">Salvar Cliente 💾</button>
        </form>
    </div>

    <!-- 3. CADASTRAR REPRESENTANTE -->
    <div class="box">
        <h3>3. Cadastrar Representante</h3>
        <form action="/cadastrar_representante" method="POST">
            <input type="text" name="nome" placeholder="Nome do Representante" required>
            <input type="text" name="telefone" placeholder="Telefone (Opcional)">
            <button type="submit" class="btn-blue">Salvar Representante 💾</button>
        </form>
    </div>

    <a href="/painel" class="link-painel">← Voltar para o Painel de Resultados</a>

    <script>
        // Quando escolhe o cliente, preenche o Zap e o Representante sozinho!
        document.getElementById('cliente_selecionado').addEventListener('change', function() {
            var selectedOption = this.options[this.selectedIndex];
            document.getElementById('whatsapp_cliente').value = selectedOption.getAttribute('data-telefone') || '';
            document.getElementById('rep_cliente').value = selectedOption.getAttribute('data-rep') || '';
        });

        function disparar() {
            var cliente = document.getElementById('cliente_selecionado').value;
            var telefone = document.getElementById('whatsapp_cliente').value;
            var rep = document.getElementById('rep_cliente').value;

            if (!cliente || !telefone || !rep) {
                alert("Por favor, selecione um cliente cadastrado na lista.");
                return;
            }

            // Limpa o telefone para garantir que o link do WhatsApp funcione
            telefone = telefone.replace(/\D/g, '');

            var linkPesquisa = `https://gelato-feedback.onrender.com/?rep=${encodeURIComponent(rep)}&cliente=${encodeURIComponent(cliente)}`;
            var mensagem = `Olá, somos da Gelato da Fran! Gostaríamos muito de ouvir a sua opinião sobre o nosso atendimento e produtos. É bem rápido, basta clicar no link abaixo:\n\n${linkPesquisa}`;
            
            var urlWhatsApp = `https://wa.me/55${telefone}?text=${encodeURIComponent(mensagem)}`;
            window.open(urlWhatsApp, '_blank');
        }
    </script>
</body>
</html>
