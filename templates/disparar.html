<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disparador WhatsApp - Gelato da Fran 🍦</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: #eff6ff; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #fff; max-width: 480px; width: 100%; padding: 25px; border-radius: 18px; box-shadow: 0 10px 25px rgba(30, 64, 175, 0.08); border-top: 6px solid #2563eb; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h2 { color: #1e3a8a; margin: 0 0 8px; font-size: 22px; }
        .header p { color: #475569; font-size: 14px; margin: 0; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-weight: 600; color: #1e293b; font-size: 14px; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 14px; outline: none; background: #f8fafc; }
        .form-group input:focus { border-color: #2563eb; background: #fff; }
        button.btn { width: 100%; background: #2563eb; color: white; border: none; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25); margin-top: 10px; transition: 0.15s; }
        button.btn:hover { background: #1d4ed8; }
        button.btn-zap { background: #10b981; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25); margin-top: 12px; }
        button.btn-zap:hover { background: #059669; }
        .resultado { margin-top: 20px; padding: 15px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 12px; display: none; text-align: center; }
        .resultado p { font-size: 14px; color: #166534; margin: 0 0 10px 0; word-break: break-all; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h2>Disparador WhatsApp 🚀</h2>
        <p>Cadastre o representante e o cliente para gerar o link de avaliação.</p>
    </div>

    <div class="form-group">
        <label for="representante">Nome do Representante:</label>
        <input type="text" id="representante" placeholder="Ex: Marcio">
    </div>

    <div class="form-group">
        <label for="cliente">Nome do Cliente / Loja:</label>
        <input type="text" id="cliente" placeholder="Ex: Panificadora Sabor">
    </div>

    <div class="form-group">
        <label for="telefone">WhatsApp do Cliente (Apenas números com DDD):</label>
        <input type="text" id="telefone" placeholder="Ex: 84999999999">
    </div>

    <button class="btn" onclick="gerarLink()">Cadastrar e Gerar Link 🔗</button>

    <div class="resultado" id="box-resultado">
        <p id="link-gerado"></p>
        <button class="btn btn-zap" onclick="enviarWhatsApp()">Enviar no WhatsApp 💚</button>
    </div>
</div>

<script>
    let urlFinal = "";

    function gerarLink() {
        const representante = document.getElementById('representante').value.trim();
        const cliente = document.getElementById('cliente').value.trim();

        if (!representante || !cliente) {
            alert("Por favor, preencha o nome do representante e do cliente!");
            return;
        }

        fetch('/cadastrar_representante', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            },
            body: JSON.stringify({ representante: representante, cliente: cliente })
        })
        .then(res => res.json())
        .then(data => {
            const base = window.location.origin;
            urlFinal = `${base}/?rep=${encodeURIComponent(representante)}&cliente=${encodeURIComponent(cliente)}`;
            
            document.getElementById('link-gerado').innerText = urlFinal;
            document.getElementById('box-resultado').style.display = 'block';
        })
        .catch(err => {
            console.error(err);
            const base = window.location.origin;
            urlFinal = `${base}/?rep=${encodeURIComponent(representante)}&cliente=${encodeURIComponent(cliente)}`;
            document.getElementById('link-gerado').innerText = urlFinal;
            document.getElementById('box-resultado').style.display = 'block';
        });
    }

    function enviarWhatsApp() {
        const telefone = document.getElementById('telefone').value.trim();
        const cliente = document.getElementById('cliente').value.trim();
        const representante = document.getElementById('representante').value.trim();

        let mensagem = `Olá ${cliente}! Aqui é da Gelato da Fran 🍦. Gostaríamos muito de saber sua opinião sobre o atendimento do nosso representante ${representante}. Por favor, clique no link abaixo para avaliar rapidinho: \n\n${urlFinal}`;
        
        let linkZap = `https://api.whatsapp.com/send?phone=55${telefone}&text=${encodeURIComponent(mensagem)}`;
        if (!telefone) {
            linkZap = `https://api.whatsapp.com/send?text=${encodeURIComponent(mensagem)}`;
        }

        window.open(linkZap, '_blank');
    }
</script>

</body>
</html>
